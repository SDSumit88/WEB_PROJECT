<!DOCTYPE html>
<html>
<head>
    <title>User Profile</title>
</head>
<body>
    <h2>User Profile</h2>
    <pre id="profile">Loading...</pre>
    <button onclick="logout()">Logout</button>

    <script>
        // ✅ Access token uthao localStorage se
        const token = localStorage.getItem("accessToken");

        // ✅ Profile API call
        fetch("/api/user/profile", {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            }
        })
        .then(res => {
            if (res.status === 401) {
                alert("Token expired. Please login again.");
                window.location.href = "index.html";
            } else if (res.status === 403) {
                alert("Forbidden. Please login again.");
                window.location.href = "index.html";
            }
            return res.json();
        })
        .then(data => {
            document.getElementById("profile").textContent = JSON.stringify(data, null, 2);
        })
        .catch(err => {
            console.error("Error:", err);
            document.getElementById("profile").textContent = "Error fetching profile.";
        });

        // ✅ Logout function
        function logout() {
            localStorage.removeItem("accessToken");
            localStorage.removeItem("refreshToken");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
