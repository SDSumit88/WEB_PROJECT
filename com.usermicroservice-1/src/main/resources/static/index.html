<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username" /><br>
    <input type="password" id="password" placeholder="Password" /><br>
    <button onclick="login()">Login</button>
    <p><a href="register.html">Don't have an account? Register here</a></p>
    

    <p id="error" style="color: red;"></p>
    
    <script >
       const apiBase = "http://localhost:8082";

async function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const res = await fetch(`${apiBase}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
    });

    if (res.ok) {
        const data = await res.json();
        localStorage.setItem("accessToken", data.accessToken);
        localStorage.setItem("refreshToken", data.refreshToken);
        window.location.href = "profile.html";
    } else {
        document.getElementById("error").innerText = "Invalid credentials";
    }
}

async function getProfile() {
    let accessToken = localStorage.getItem("accessToken");

    let res = await fetch(`${apiBase}/api/user/profile`, {
        method: "GET",
        headers: {
            Authorization: `Bearer ${accessToken}`
        }
    });

    if (res.status === 401) {
        // Try refresh
        const refreshRes = await fetch(`${apiBase}/api/auth/refresh`, {
            method: "POST",
            headers: {
                Authorization: `Bearer ${localStorage.getItem("refreshToken")}`
            }
        });

        if (refreshRes.ok) {
            const tokenData = await refreshRes.json();
            localStorage.setItem("accessToken", tokenData.accessToken);

            // Retry profile request
            return getProfile();
        } else {
            alert("Session expired. Login again.");
            logout();
            return;
        }
    }

    const profile = await res.json();
    document.getElementById("profile").innerText = JSON.stringify(profile, null, 2);
}

function logout() {
    localStorage.removeItem("accessToken");
    localStorage.removeItem("refreshToken");
    window.location.href = "index.html";
}

// Auto run when profile page is opened
if (window.location.pathname.endsWith("profile.html")) {
    getProfile();
}
       
 
 </script>

   
</body>
</html>
